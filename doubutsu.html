<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>どうぶつ図鑑</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f1f8e9;
      --card-radius: 24px;
    }

    html, body { height: 100dvh; overflow: hidden; }

    body {
      background: var(--bg);
      font-family: "Hiragino Maru Gothic ProN", "BIZ UDPGothic", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      touch-action: manipulation;
    }

    nav {
      width: 100%;
      max-width: 480px;
      padding: clamp(6px, 1.5dvh, 12px) 16px 0;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-back, .bgm-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: clamp(34px, 8vw, 42px);
      height: clamp(34px, 8vw, 42px);
      font-size: clamp(1.1rem, 4.5vw, 1.4rem);
      font-weight: 700;
      color: #388e3c;
      text-decoration: none;
      background: #dcedc8;
      border-radius: 50%;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
      -webkit-tap-highlight-color: transparent;
      border: none;
      cursor: pointer;
    }

    header {
      flex-shrink: 0;
      width: 100%;
      text-align: center;
      padding: clamp(6px, 1.5dvh, 16px) 16px clamp(4px, 1dvh, 8px);
    }

    header h1 {
      font-size: clamp(1.2rem, 5vw, 2rem);
      color: #388e3c;
      letter-spacing: 0.15em;
      text-shadow: 2px 2px 0 #dcedc8;
    }

    header p {
      font-size: clamp(0.75rem, 3vw, 1rem);
      color: #8d6e63;
      margin-top: 2px;
      letter-spacing: 0.1em;
    }

    main {
      flex: 1;
      min-height: 0;
      width: 100%;
      max-width: 480px;
      padding: clamp(6px, 1.5dvh, 10px) clamp(8px, 3vw, 14px);
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: repeat(3, 1fr);
      gap: clamp(6px, 1.5dvh, 12px);
    }

    .card {
      position: relative;
      border-radius: var(--card-radius);
      box-shadow: 0 4px 14px rgba(0,0,0,0.13);
      overflow: hidden;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: box-shadow 0.15s, transform 0.1s;
    }

    .card:active { transform: scale(0.96); box-shadow: 0 2px 6px rgba(0,0,0,0.12); }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .label {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: clamp(4px, 1dvh, 8px) 6px clamp(5px, 1.2dvh, 10px);
      text-align: center;
      font-size: clamp(0.85rem, 4vw, 1.3rem);
      font-weight: 700;
      letter-spacing: 0.08em;
      line-height: 1;
    }

    .card[data-animal="inu"]   { background: #fff8e1; }
    .card[data-animal="inu"] .label   { background: rgba(255,248,225,0.88); color: #e65100; }

    .card[data-animal="neko"]  { background: #fce4ec; }
    .card[data-animal="neko"] .label  { background: rgba(252,228,236,0.88); color: #ad1457; }

    .card[data-animal="ushi"]  { background: #f3e5f5; }
    .card[data-animal="ushi"] .label  { background: rgba(243,229,245,0.88); color: #6a1b9a; }

    .card[data-animal="raion"] { background: #fff3e0; }
    .card[data-animal="raion"] .label { background: rgba(255,243,224,0.88); color: #bf360c; }

    .card[data-animal="zou"]   { background: #ede7f6; }
    .card[data-animal="zou"] .label   { background: rgba(237,231,246,0.88); color: #4527a0; }

    .card[data-animal="buta"]  { background: #fce4ec; }
    .card[data-animal="buta"] .label  { background: rgba(252,228,236,0.88); color: #c2185b; }


    .card:nth-child(6n + 1) { background: #fff8e1; }
    .card:nth-child(6n + 1) .label { background: rgba(255,248,225,0.88); color: #e65100; }
    .card:nth-child(6n + 2) { background: #fce4ec; }
    .card:nth-child(6n + 2) .label { background: rgba(252,228,236,0.88); color: #ad1457; }
    .card:nth-child(6n + 3) { background: #f3e5f5; }
    .card:nth-child(6n + 3) .label { background: rgba(243,229,245,0.88); color: #6a1b9a; }
    .card:nth-child(6n + 4) { background: #fff3e0; }
    .card:nth-child(6n + 4) .label { background: rgba(255,243,224,0.88); color: #bf360c; }
    .card:nth-child(6n + 5) { background: #ede7f6; }
    .card:nth-child(6n + 5) .label { background: rgba(237,231,246,0.88); color: #4527a0; }
    .card:nth-child(6n + 6) { background: #e8f5e9; }
    .card:nth-child(6n + 6) .label { background: rgba(232,245,233,0.88); color: #2e7d32; }

    .sound-mark {
      position: absolute;
      top: clamp(6px, 1.5dvh, 10px);
      right: clamp(6px, 1.5dvh, 10px);
      width: clamp(28px, 8vw, 38px);
      height: clamp(28px, 8vw, 38px);
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(255,255,255,0.9);
      box-shadow: 0 2px 8px rgba(0,0,0,0.18);
      font-size: clamp(0.9rem, 4vw, 1.2rem);
      z-index: 2;
    }
    /* ===== オーバーレイ ===== */
    #overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 100;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: clamp(12px, 3dvh, 24px);
    }
    #overlay.active { display: flex; }

    @keyframes pop-in {
      0%   { transform: scale(0.6); opacity: 0; }
      70%  { transform: scale(1.06); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    #overlay-img {
      width: min(80vw, 80dvh);
      height: min(80vw, 80dvh);
      object-fit: cover;
      border-radius: 28px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.4);
      animation: pop-in 0.35s cubic-bezier(.36,.07,.19,.97) forwards;
    }

    #overlay-label {
      font-size: clamp(1.6rem, 8vw, 2.8rem);
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    footer {
      flex-shrink: 0;
      padding: clamp(4px, 1dvh, 12px) 0 clamp(6px, 1.5dvh, 16px);
      color: #bcaaa4;
      font-size: 0.7rem;
      letter-spacing: 0.05em;
    }
  </style>
  <link rel="stylesheet" href="app-shell.css">
  <link rel="stylesheet" href="catalog-pagination.css">
</head>

<footer></footer>

<div id="overlay">
  <img id="overlay-img" src="" alt="">
  <span id="overlay-label"></span>
</div>

<script>
  // ===== BGM =====
  const bgm = document.getElementById('bgm');
  const bgmToggle = document.getElementById('bgmToggle');
  const BGM_NORMAL_VOLUME = 0.225;
  const BGM_DUCKED_VOLUME = 0.054;
  bgm.volume = BGM_NORMAL_VOLUME;
  bgm.dataset.normalVolume = BGM_NORMAL_VOLUME;
  let bgmFadeFrame = 0;
  function fadeBgmTo(target, duration = 180) {
    cancelAnimationFrame(bgmFadeFrame);
    const startVolume = bgm.volume;
    const startedAt = performance.now();
    function step(now) {
      const progress = Math.min(1, (now - startedAt) / duration);
      bgm.volume = startVolume + (target - startVolume) * progress;
      if (progress < 1) bgmFadeFrame = requestAnimationFrame(step);
    }
    bgmFadeFrame = requestAnimationFrame(step);
  }
  function tryPlayBgm() { bgm.play().catch(() => {}); }
  tryPlayBgm();
  document.addEventListener('click', tryPlayBgm, { once: true });
  document.addEventListener('touchstart', tryPlayBgm, { once: true });
  bgmToggle.addEventListener('click', (e) => {
    e.stopPropagation();
    bgm.muted = !bgm.muted;
    bgmToggle.textContent = bgm.muted ? '🔇' : '🔊';
  });
  ZukanFX.initToggle(document.getElementById('fxToggle'));

  const audioCache = {};
  function getAudio(src) {
    if (!audioCache[src]) { const a = new Audio(src); a.preload = 'auto'; audioCache[src] = a; }
    return audioCache[src];
  }
  const allCards = Array.from(document.querySelectorAll('.card'));
  function preloadCards(cards) {
    cards.forEach(card => {
      if (card.dataset.voice) getAudio(card.dataset.voice);
      if (card.dataset.se)    getAudio(card.dataset.se);
    });
  }
  preloadCards(allCards.slice(0, 6));
  document.addEventListener('zukan-page-change', (event) => {
    preloadCards(event.detail.visibleCards);
  });

  const overlay    = document.getElementById('overlay');
  const overlayImg = document.getElementById('overlay-img');
  const overlayLbl = document.getElementById('overlay-label');
  let isOpen = false, session = 0;

  function closeOverlay() {
    session++;
    overlay.classList.remove('active');
    isOpen = false;
    fadeBgmTo(BGM_NORMAL_VOLUME, 280);
  }

  function openOverlay(card) {
    if (isOpen) return;
    isOpen = true;
    const mySession = ++session;

    const img = card.querySelector('.card-img');
    overlayImg.style.animation = 'none';
    overlayImg.offsetHeight;
    overlayImg.style.animation = '';
    overlayImg.src = img.src;
    overlayImg.alt = img.alt;
    overlayLbl.textContent = card.dataset.label;
    overlay.classList.add('active');
    ZukanFX.burst(overlay, card);
    fadeBgmTo(BGM_DUCKED_VOLUME);

    const voice = getAudio(card.dataset.voice);
    const seSrc = card.dataset.se;
    const se    = seSrc ? getAudio(seSrc) : null;

    // ①ずんだもん読み上げ → ②鳴き声SE → 2秒後に閉じる
    voice.currentTime = 0;
    voice.play().catch(() => {});

    voice.onended = () => {
      if (session !== mySession) return;
      if (!se) {
        setTimeout(() => { if (session === mySession) closeOverlay(); }, 2000);
        return;
      }
      se.currentTime = 0;
      se.play().catch(() => {});
      se.onended = () => {
        if (session !== mySession) return;
        setTimeout(() => { if (session === mySession) closeOverlay(); }, 2000);
      };
      // SE が終わらない場合のフォールバック
      setTimeout(() => { if (session === mySession) closeOverlay(); }, 8000);
    };

    // 全体フォールバック
    setTimeout(() => { if (session === mySession) closeOverlay(); }, 12000);
  }

  document.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', () => {
      ZukanFX.tap(card);
      openOverlay(card);
    });
  });
  overlay.addEventListener('click', closeOverlay);
  document.addEventListener('touchstart', () => {}, { passive: true });
</script>

<script src="app-shell.js"></script>
<script src="catalog-pagination.js"></script>
</body>
</html>
