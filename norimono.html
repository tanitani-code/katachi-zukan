<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>のりもの図鑑</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #e3f2fd;
      --card-radius: 24px;
    }

    html, body { height: 100dvh; overflow: hidden; }

    body {
      background: var(--bg);
      font-family: "Hiragino Maru Gothic ProN", "BIZ UDPGothic", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      touch-action: manipulation;
    }

    /* ===== ナビ ===== */
    nav {
      width: 100%;
      max-width: 480px;
      padding: clamp(6px, 1.5dvh, 12px) 16px 0;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-back, .bgm-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: clamp(34px, 8vw, 42px);
      height: clamp(34px, 8vw, 42px);
      font-size: clamp(1.1rem, 4.5vw, 1.4rem);
      font-weight: 700;
      color: #1565c0;
      text-decoration: none;
      background: #e3f2fd;
      border-radius: 50%;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
      -webkit-tap-highlight-color: transparent;
      border: none;
      cursor: pointer;
    }

    /* ===== ヘッダー ===== */
    header {
      flex-shrink: 0;
      width: 100%;
      text-align: center;
      padding: clamp(4px, 1dvh, 12px) 16px clamp(3px, 0.8dvh, 6px);
    }

    header h1 {
      font-size: clamp(1.2rem, 5vw, 2rem);
      color: #1565c0;
      letter-spacing: 0.15em;
      text-shadow: 2px 2px 0 #bbdefb;
    }

    header p {
      font-size: clamp(0.75rem, 3vw, 1rem);
      color: #8d6e63;
      margin-top: 2px;
      letter-spacing: 0.1em;
    }

    /* ===== グリッド：2列×3行 ===== */
    main {
      flex: 1;
      min-height: 0;
      width: 100%;
      max-width: 480px;
      padding: clamp(6px, 1.5dvh, 10px) clamp(8px, 3vw, 14px);
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: repeat(3, 1fr);
      gap: clamp(6px, 1.5dvh, 12px);
    }

    /* ===== カード ===== */
    .card {
      position: relative;
      border-radius: var(--card-radius);
      box-shadow: 0 4px 14px rgba(0,0,0,0.13);
      overflow: hidden;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: box-shadow 0.15s, transform 0.1s;
    }

    .card:active {
      transform: scale(0.96);
      box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    }

    /* 画像をカード全体に */
    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* 名前ラベル：下部に半透明オーバーレイ */
    .label {
      background: rgba(255, 255, 255, 0.90);
      color: #263238;
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: clamp(4px, 1dvh, 8px) 6px clamp(5px, 1.2dvh, 10px);
      text-align: center;
      font-size: clamp(0.85rem, 4vw, 1.3rem);
      font-weight: 700;
      letter-spacing: 0.08em;
      line-height: 1;
    }

    .card[data-vehicle="densha"] { background: #e3f2fd; }
    .card[data-vehicle="densha"] .label { background: rgba(227,242,253,0.90); color: #1565c0; }
    .card[data-vehicle="shoubousha"] { background: #ffebee; }
    .card[data-vehicle="shoubousha"] .label { background: rgba(255,235,238,0.90); color: #c62828; }
    .card[data-vehicle="kyuukyuusha"] { background: #fff8e1; }
    .card[data-vehicle="kyuukyuusha"] .label { background: rgba(255,248,225,0.90); color: #d84315; }
    .card[data-vehicle="patocar"] { background: #eceff1; }
    .card[data-vehicle="patocar"] .label { background: rgba(236,239,241,0.90); color: #263238; }
    .card[data-vehicle="bus"] { background: #fff3e0; }
    .card[data-vehicle="bus"] .label { background: rgba(255,243,224,0.90); color: #e65100; }
    .card[data-vehicle="hikouki"] { background: #e1f5fe; }
    .card[data-vehicle="hikouki"] .label { background: rgba(225,245,254,0.90); color: #0277bd; }
    /* ===== オーバーレイ ===== */
    #overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 100;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: clamp(12px, 3dvh, 24px);
    }

    #overlay.active { display: flex; }

    @keyframes pop-in {
      0%   { transform: scale(0.6); opacity: 0; }
      70%  { transform: scale(1.06); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    #overlay-img {
      width: min(80vw, 80dvh);
      height: min(80vw, 80dvh);
      object-fit: cover;
      border-radius: 28px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.4);
      animation: pop-in 0.35s cubic-bezier(.36,.07,.19,.97) forwards;
    }

    #overlay-label {
      font-size: clamp(1.6rem, 8vw, 2.8rem);
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    footer {
      flex-shrink: 0;
      padding: clamp(4px, 1dvh, 10px) 0 clamp(6px, 1.5dvh, 14px);
      color: #bcaaa4;
      font-size: 0.7rem;
      letter-spacing: 0.05em;
    }
  </style>
  <link rel="stylesheet" href="app-shell.css">
  <link rel="stylesheet" href="catalog-pagination.css">
</head>
