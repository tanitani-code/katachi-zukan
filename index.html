<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>はじめて図鑑</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #fff9e6;
      --card-radius: 24px;
    }

    html, body { height: 100dvh; overflow: hidden; }

    body {
      background: var(--bg);
      font-family: "Hiragino Maru Gothic ProN", "BIZ UDPGothic", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      touch-action: manipulation;
    }

    header {
      flex-shrink: 0;
      width: 100%;
      text-align: center;
      padding: clamp(10px, 2.5dvh, 20px) 16px clamp(4px, 1dvh, 8px);
    }

    header h1 {
      font-size: clamp(1.15rem, 5.2vw, 2rem);
      color: #ef6c00;
      letter-spacing: 0.08em;
      text-shadow: 2px 2px 0 #ffe0b2;
      line-height: 1.3;
    }

    header p {
      font-size: clamp(0.7rem, 2.8vw, 0.95rem);
      color: #a1887f;
      margin-top: 4px;
      letter-spacing: 0.1em;
    }

    /* ===== グリッド：2列×4行（7カテゴリ＋のりものは全幅） ===== */
    main {
      flex: 1;
      min-height: 0;
      width: 100%;
      max-width: 480px;
      padding: clamp(4px, 1dvh, 10px) clamp(8px, 3vw, 16px);
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: repeat(3, 1fr) clamp(50px, 12dvh, 76px);
      gap: clamp(6px, 1.4dvh, 12px);
    }

    /* ===== カード ===== */
    .card {
      position: relative;
      border-radius: var(--card-radius);
      box-shadow: 0 4px 14px rgba(0,0,0,0.12);
      overflow: hidden;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: box-shadow 0.15s, transform 0.1s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }

    .card:active { transform: scale(0.96); box-shadow: 0 2px 6px rgba(0,0,0,0.10); }

    .icon-wrap {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .icon-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .label {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: clamp(4px, 1dvh, 8px) 6px clamp(5px, 1.2dvh, 10px);
      text-align: center;
      font-size: clamp(0.85rem, 4vw, 1.25rem);
      font-weight: 700;
      letter-spacing: 0.06em;
      line-height: 1;
    }

    /* ===== CSS図形アイコン（かたち・いろ・かず） ===== */
    .icon-shape {
      width: clamp(36px, 9dvh, 62px);
      height: clamp(36px, 9dvh, 62px);
      border-radius: 50%;
      background: #ffca28;
      box-shadow: 0 4px 12px rgba(255,202,40,0.5);
    }

    .icon-dots {
      display: flex;
      gap: clamp(4px, 1.2vw, 8px);
    }
    .icon-dots span {
      width: clamp(16px, 4.2dvh, 26px);
      height: clamp(16px, 4.2dvh, 26px);
      border-radius: 50%;
    }
    .icon-dots span:nth-child(1) { background: #e53935; }
    .icon-dots span:nth-child(2) { background: #43a047; }
    .icon-dots span:nth-child(3) { background: #1e88e5; }

    .icon-num {
      font-size: clamp(1.6rem, 8dvh, 2.6rem);
      font-weight: 900;
      color: #558b2f;
      line-height: 1;
    }

    /* ===== カードカラー ===== */
    .card[data-cat="katachi"]   { background: #fff8e1; }
    .card[data-cat="katachi"] .label   { background: rgba(255,248,225,0.9); color: #f57f17; }

    .card[data-cat="iro"]       { background: #f3f8ff; }
    .card[data-cat="iro"] .label       { background: rgba(243,248,255,0.9); color: #5c6bc0; }

    .card[data-cat="kazu"]      { background: #f9fbe7; }
    .card[data-cat="kazu"] .label      { background: rgba(249,251,231,0.9); color: #558b2f; }

    .card[data-cat="kudamono"]  { background: #fff5f5; }
    .card[data-cat="kudamono"] .label  { background: rgba(255,245,245,0.9); color: #c62828; }

    .card[data-cat="yasai"]    { background: #e8f5e9; }
    .card[data-cat="yasai"] .label     { background: rgba(232,245,233,0.9); color: #2e7d32; }

    .card[data-cat="doubutsu"]  { background: #f1f8e9; }
    .card[data-cat="doubutsu"] .label  { background: rgba(241,248,233,0.9); color: #388e3c; }

    /* ===== のりもの：準備中（全幅・タップ不可） ===== */
    .card[data-cat="norimono"] {
      grid-column: 1 / 3;
      background: #eceff1;
      flex-direction: row;
      gap: clamp(8px, 2vw, 14px);
      cursor: default;
      opacity: 0.85;
    }
    .card[data-cat="norimono"]:active { transform: none; box-shadow: 0 4px 14px rgba(0,0,0,0.12); }
    .card[data-cat="norimono"] .icon-wrap { flex: none; width: clamp(40px, 9dvh, 60px); height: clamp(40px, 9dvh, 60px); }
    .card[data-cat="norimono"] .icon-shape-bus {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      font-size: clamp(1.5rem, 7dvh, 2.2rem);
    }
    .card[data-cat="norimono"] .label {
      position: static;
      background: none !important;
      color: #607d8b;
      text-align: left;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
    }
    .card[data-cat="norimono"] .label .sub {
      font-size: clamp(0.6rem, 2.4vw, 0.75rem);
      font-weight: 700;
      color: #90a4ae;
      background: #fff;
      border-radius: 10px;
      padding: 1px 8px;
      letter-spacing: 0.05em;
    }

    footer {
      flex-shrink: 0;
      padding: clamp(4px, 1dvh, 10px) 0 clamp(6px, 1.5dvh, 14px);
      color: #bcaaa4;
      font-size: 0.68rem;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

<header>
  <h1>はじめて図鑑</h1>
  <p>すきな ずかんを えらんでね</p>
</header>

<main>
  <a class="card" data-cat="katachi" href="katachi.html">
    <div class="icon-wrap"><div class="icon-shape"></div></div>
    <span class="label">かたち</span>
  </a>

  <a class="card" data-cat="iro" href="iro.html">
    <div class="icon-wrap">
      <div class="icon-dots"><span></span><span></span><span></span></div>
    </div>
    <span class="label">いろ</span>
  </a>

  <a class="card" data-cat="kazu" href="kazu.html">
    <div class="icon-wrap"><span class="icon-num">123</span></div>
    <span class="label">かず</span>
  </a>

  <a class="card" data-cat="kudamono" href="kudamono.html">
    <div class="icon-wrap"><img src="images/fruits/ringo.png" alt="くだもの"></div>
    <span class="label">くだもの</span>
  </a>

  <a class="card" data-cat="yasai" href="yasai.html">
    <div class="icon-wrap"><img src="images/vegetables/burokkorii.png" alt="やさい"></div>
    <span class="label">やさい</span>
  </a>

  <a class="card" data-cat="doubutsu" href="doubutsu.html">
    <div class="icon-wrap"><img src="images/animals/inu.png" alt="どうぶつ"></div>
    <span class="label">どうぶつ</span>
  </a>

  <div class="card" data-cat="norimono">
    <div class="icon-wrap"><div class="icon-shape-bus">🚌</div></div>
    <span class="label">のりもの<span class="sub">じゅんびちゅう</span></span>
  </div>
</main>

<footer>はじめて図鑑 ✦ 2さいから</footer>

</body>
</html>
