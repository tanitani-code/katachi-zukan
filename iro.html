<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>いろ図鑑</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f3f8ff;
      --card-radius: 24px;
      --s: clamp(44px, 10dvh, 78px);
    }

    html, body { height: 100dvh; overflow: hidden; }

    body {
      background: var(--bg);
      font-family: "Hiragino Maru Gothic ProN", "BIZ UDPGothic", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      touch-action: manipulation;
    }

    nav {
      width: 100%;
      max-width: 480px;
      padding: clamp(6px, 1.5dvh, 12px) 16px 0;
      flex-shrink: 0;
    }

    .nav-back {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: clamp(34px, 8vw, 42px);
      height: clamp(34px, 8vw, 42px);
      font-size: clamp(1.1rem, 4.5vw, 1.4rem);
      font-weight: 700;
      color: #5c6bc0;
      text-decoration: none;
      background: #e8eaf6;
      border-radius: 50%;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
      -webkit-tap-highlight-color: transparent;
    }

    .nav-fwd {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: clamp(0.75rem, 3vw, 0.95rem);
      font-weight: 700;
      text-decoration: none;
      border-radius: 20px;
      padding: 5px 14px 5px 10px;
      -webkit-tap-highlight-color: transparent;
    }

    header {
      flex-shrink: 0;
      width: 100%;
      text-align: center;
      padding: clamp(6px, 1.5dvh, 16px) 16px clamp(4px, 1dvh, 8px);
    }

    header h1 {
      font-size: clamp(1.2rem, 5vw, 2rem);
      color: #5c6bc0;
      letter-spacing: 0.15em;
      text-shadow: 2px 2px 0 #c5cae9;
    }

    header p {
      font-size: clamp(0.75rem, 3vw, 1rem);
      color: #9575cd;
      margin-top: 2px;
      letter-spacing: 0.1em;
    }

    main {
      flex: 1;
      min-height: 0;
      width: 100%;
      max-width: 480px;
      padding: clamp(6px, 1.5dvh, 12px) clamp(8px, 3vw, 16px);
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: repeat(3, 1fr);
      gap: clamp(6px, 1.5dvh, 14px);
    }

    .card {
      position: relative;
      border-radius: var(--card-radius);
      box-shadow: 0 4px 14px rgba(0,0,0,0.12);
      overflow: hidden;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: box-shadow 0.15s, transform 0.1s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .card:active { transform: scale(0.96); box-shadow: 0 2px 6px rgba(0,0,0,0.10); }

    .shape-wrap {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dot {
      width: var(--s);
      height: var(--s);
      border-radius: 50%;
    }

    .label {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: clamp(4px, 1dvh, 8px) 6px clamp(5px, 1.2dvh, 10px);
      text-align: center;
      font-size: clamp(0.85rem, 4vw, 1.3rem);
      font-weight: 700;
      letter-spacing: 0.08em;
      line-height: 1;
    }

    .card[data-color="aka"]    { background: #fff5f5; }
    .card[data-color="aka"] .dot    { background: #e53935; box-shadow: 0 4px 14px rgba(229,57,53,0.45); }
    .card[data-color="aka"] .label  { background: rgba(255,245,245,0.88); color: #b71c1c; }

    .card[data-color="ao"]     { background: #e3f2fd; }
    .card[data-color="ao"] .dot     { background: #1e88e5; box-shadow: 0 4px 14px rgba(30,136,229,0.45); }
    .card[data-color="ao"] .label   { background: rgba(227,242,253,0.88); color: #0d47a1; }

    .card[data-color="kiiro"]  { background: #fffde7; }
    .card[data-color="kiiro"] .dot  { background: #fdd835; box-shadow: 0 4px 14px rgba(253,216,53,0.55); }
    .card[data-color="kiiro"] .label{ background: rgba(255,253,231,0.88); color: #f57f17; }

    .card[data-color="midori"] { background: #e8f5e9; }
    .card[data-color="midori"] .dot { background: #43a047; box-shadow: 0 4px 14px rgba(67,160,71,0.45); }
    .card[data-color="midori"] .label{ background: rgba(232,245,233,0.88); color: #1b5e20; }

    .card[data-color="shiro"]  { background: #eceff1; }
    .card[data-color="shiro"] .dot  { background: #fff; box-shadow: 0 4px 14px rgba(0,0,0,0.12), inset 0 0 0 3px #cfd8dc; }
    .card[data-color="shiro"] .label{ background: rgba(236,239,241,0.88); color: #546e7a; }

    .card[data-color="kuro"]   { background: #eeeeee; }
    .card[data-color="kuro"] .dot   { background: #212121; box-shadow: 0 4px 14px rgba(0,0,0,0.35); }
    .card[data-color="kuro"] .label { background: rgba(238,238,238,0.88); color: #212121; }

    /* ===== オーバーレイ ===== */
    #overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 100;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: clamp(12px, 3dvh, 24px);
    }
    #overlay.active { display: flex; }

    @keyframes pop-in {
      0%   { transform: scale(0.6); opacity: 0; }
      70%  { transform: scale(1.06); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    #overlay-visual {
      width: min(80vw, 80dvh);
      height: min(80vw, 80dvh);
      border-radius: 28px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      animation: pop-in 0.35s cubic-bezier(.36,.07,.19,.97) forwards;
    }

    #overlay-visual .shape-wrap { transform: scale(2.8); flex: none; }

    #overlay-label {
      font-size: clamp(1.6rem, 8vw, 2.8rem);
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    footer {
      flex-shrink: 0;
      padding: clamp(4px, 1dvh, 12px) 0 clamp(6px, 1.5dvh, 16px);
      color: #b0bec5;
      font-size: 0.7rem;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

<nav>
  <a class="nav-back" href="index.html" aria-label="トップへ戻る">×</a>
  <a class="nav-fwd" href="kazu.html" style="color:#558b2f;background:#f1f8e9;">🔢 かず図鑑へ ▶</a>
</nav>

<header>
  <h1>🎨 いろ図鑑</h1>
  <p>たっぷして あそぼう！</p>
</header>

<main>
  <div class="card" data-color="aka"    data-sound="sounds/aka.mp3"    data-label="あか">
    <div class="shape-wrap"><div class="dot"></div></div>
    <span class="label">あか</span>
  </div>
  <div class="card" data-color="ao"     data-sound="sounds/ao.mp3"     data-label="あお">
    <div class="shape-wrap"><div class="dot"></div></div>
    <span class="label">あお</span>
  </div>
  <div class="card" data-color="kiiro"  data-sound="sounds/kiiro.mp3"  data-label="きいろ">
    <div class="shape-wrap"><div class="dot"></div></div>
    <span class="label">きいろ</span>
  </div>
  <div class="card" data-color="midori" data-sound="sounds/midori.mp3" data-label="みどり">
    <div class="shape-wrap"><div class="dot"></div></div>
    <span class="label">みどり</span>
  </div>
  <div class="card" data-color="shiro"  data-sound="sounds/shiro.mp3"  data-label="しろ">
    <div class="shape-wrap"><div class="dot"></div></div>
    <span class="label">しろ</span>
  </div>
  <div class="card" data-color="kuro"   data-sound="sounds/kuro.mp3"   data-label="くろ">
    <div class="shape-wrap"><div class="dot"></div></div>
    <span class="label">くろ</span>
  </div>
</main>

<footer>いろ図鑑 ✦ 2さいから</footer>

<div id="overlay">
  <div id="overlay-visual"></div>
  <span id="overlay-label"></span>
</div>

<script>
  const audioCache = {};
  function getAudio(src) {
    if (!audioCache[src]) { const a = new Audio(src); a.preload = 'auto'; audioCache[src] = a; }
    return audioCache[src];
  }
  document.querySelectorAll('.card').forEach(card => { if (card.dataset.sound) getAudio(card.dataset.sound); });

  const overlay = document.getElementById('overlay');
  const overlayVisual = document.getElementById('overlay-visual');
  const overlayLbl = document.getElementById('overlay-label');
  let isOpen = false, session = 0;

  function closeOverlay() {
    session++;
    overlay.classList.remove('active');
    isOpen = false;
  }

  function openOverlay(card) {
    if (isOpen) return;
    isOpen = true;
    const mySession = ++session;

    const clone = card.querySelector('.shape-wrap').cloneNode(true);
    clone.classList.remove('bouncing');
    // .dot の色はカード内の子孫セレクタ依存のため、クローン後は明示的にコピーする
    const srcDot = card.querySelector('.dot');
    const cloneDot = clone.querySelector('.dot');
    if (srcDot && cloneDot) {
      const cs = getComputedStyle(srcDot);
      cloneDot.style.background = cs.backgroundColor;
      cloneDot.style.boxShadow = cs.boxShadow;
    }
    overlayVisual.style.background = getComputedStyle(card).backgroundColor;
    overlayVisual.innerHTML = '';
    overlayVisual.appendChild(clone);

    overlayLbl.textContent = card.dataset.label;
    overlayVisual.style.animation = 'none';
    overlayVisual.offsetHeight;
    overlayVisual.style.animation = '';
    overlay.classList.add('active');

    const audio = getAudio(card.dataset.sound);
    audio.currentTime = 0;
    audio.play().catch(() => {});
    audio.onended = () => {
      if (session !== mySession) return;
      setTimeout(() => { if (session === mySession) closeOverlay(); }, 2000);
    };
    setTimeout(() => { if (session === mySession) closeOverlay(); }, 8000);
  }

  document.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', () => openOverlay(card));
  });
  overlay.addEventListener('click', closeOverlay);
  document.addEventListener('touchstart', () => {}, { passive: true });
</script>

</body>
</html>
